<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdEase - Ověření PIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ověření slevy</h1>
        <form id="pinForm">
            <input type="text" id="pinCode" placeholder="PIN" maxlength="6" required>
            <button type="submit">Ověřit</button>
            <p id="result"></p>
        </form>
        <button id="logout" class="logout">Odhlásit</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
