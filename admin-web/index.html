<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdEase Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginPage" class="login-page">
        <div class="login-header">
            <img src="logo.png" alt="CrowdEase" class="login-logo">
            <h1 class="login-title">CrowdEase</h1>
            <p class="login-subtitle">Administrační panel</p>
        </div>
        <div class="login-box">
            <form id="loginForm">
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="M22 6l-10 7L2 6"/>
                    </svg>
                    <input type="email" id="email" placeholder="E-mailová adresa" required>
                </div>
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0110 0v4"/>
                    </svg>
                    <input type="password" id="password" placeholder="Heslo" required>
                </div>
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span class="toggle"></span>
                        Zapamatovat si mě
                    </label>
                    <a href="#" class="forgot-link">Zapomenuté heslo?</a>
                </div>
                <button type="submit" class="login-btn">Přihlásit se</button>
                <p id="error" class="error"></p>
                <p class="register-text">Jste tu nový? <a href="#">Požádat o přístup.</a></p>
            </form>
        </div>
    </div>

    <div id="app" class="app hidden">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="logo.png" alt="CrowdEase" class="sidebar-logo-img">
                <span>CrowdEase</span>
            </div>
            <nav>
                <a href="#dashboard" class="nav-link active" data-page="dashboard">Dashboard</a>
                <a href="#nabidky" class="nav-link" data-page="nabidky">Nabídky</a>
                <a href="#nova-nabidka" class="nav-link" data-page="nova-nabidka">Vytvořit nabídku</a>
                <a href="#kalendar" class="nav-link" data-page="kalendar">Kalendář</a>
                <a href="#nastaveni" class="nav-link" data-page="nastaveni">Nastavení</a>
            </nav>
            <button id="logoutBtn" class="logout-btn">Odhlásit</button>
        </aside>
        <main class="main">
            <div id="pageContent"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
