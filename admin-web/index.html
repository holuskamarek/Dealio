<!DOCTYPE html>
<html lang="cs">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdEase Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CrowdEase Admin</h1>

        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
